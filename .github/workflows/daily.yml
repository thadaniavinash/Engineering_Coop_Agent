name: Daily co-op search

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 7:00 a.m. Toronto in summer (6:00 a.m. in winter). GitHub may start it a little late.
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab
    inputs:
      send_email:
        description: "Send the email digest"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: coop-scout
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Search job boards
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send_email }}" = "false" ]; then
            python -m agent.run --no-email
          else
            python -m agent.run
          fi

      - name: Save results
        run: |
          git config user.name "co-op-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data config/ats_cache.json
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Daily search results $(TZ=America/Toronto date +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
